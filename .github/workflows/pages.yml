name: GitHub Pages

on:
  push:
    branches: [ccr-be2cfb8e-czgqjb]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Kunefe
          NEXT_PUBLIC_SITE_URL: https://formxweb.github.io/Kunefe
          # Önizleme yayını: arama motorları dizine eklemesin
          NEXT_PUBLIC_NOINDEX: "1"
          NEXT_TELEMETRY_DISABLED: "1"
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages kaynağı hâlâ "Deploy from a branch" ise klasik Jekyll yayını da çalışır;
      # onun bitmesini bekleyip en son bu sürümü yayınla. Kaynak "GitHub Actions" olunca beklemez.
      - name: Klasik Pages yayınını bekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type || echo unknown)
          echo "Pages build_type: $type"
          if [ "$type" = "legacy" ]; then sleep 90; fi
      - id: deployment
        uses: actions/deploy-pages@v4
